name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;36.0.0 platforms;android-36'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Read current version
        id: version
        run: |
          VERSION_CODE=$(grep 'versionCode=' version.properties | cut -d'=' -f2)
          VERSION_NAME=$(grep 'versionName=' version.properties | cut -d'=' -f2)
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-keystore.jks

      - name: Build Release
        env:
          KEYSTORE_FILE: ../release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE=${{ steps.version.outputs.code }}
          VERSION_NAME=${{ steps.version.outputs.name }}
          TAG="v$VERSION_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" || echo "Tag $TAG already exists"
          git push origin "$TAG" || echo "Tag $TAG already exists on remote"

          gh release create "$TAG" \
            --title "Release $VERSION_NAME" \
            --notes "Release $VERSION_NAME (build $VERSION_CODE)" \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/apk/release/app-release.apk

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: fastlane

      - name: Deploy to Play Store
        env:
          SUPPLY_PACKAGE_NAME: dev.iyas.ninilala
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_STORE_JSON_KEY }}
        run: |
          cd fastlane
          bundle exec fastlane deploy_internal

      - name: Increment version
        run: |
          VERSION_CODE=${{ steps.version.outputs.code }}
          VERSION_NAME=${{ steps.version.outputs.name }}
          NEW_CODE=$((VERSION_CODE + 1))

          sed -i "s/versionCode=$VERSION_CODE/versionCode=$NEW_CODE/" version.properties

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore: bump version to $NEW_CODE [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push failed - manual intervention may be needed"
